schema_version: "1.0"
name: lookup-port
tags: [lookup]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Which environment variable sets the server port in this project, and what port is used when it is unset? Answer briefly."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: regex
    name: "names PORT"
    target: last_message
    pattern: "\\bPORT\\b"
  - type: regex
    name: "names the 3000 default"
    target: last_message
    pattern: "\\b3000\\b"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
