schema_version: "1.0"
name: wide-debug-handler
tags: [wide]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "One endpoint returns 409 for a request that should succeed, and then accepts a repeat of the same operation that it should reject. Find the inverted conflict check and fix it. Do not edit existing spec files."
  max_turns: 30
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: command
    name: "hidden tests pass"
    run: "cp \"$CASE_DIR/hidden.spec.ts\" src/ && bun test"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
