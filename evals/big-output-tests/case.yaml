schema_version: "1.0"
name: big-output-tests
tags: [big-output]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "`bun test` fails in this project. Find the bug and fix it without changing any test or the catalog data."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: command
    name: "tests pass, spec and catalog unchanged"
    run: "git diff --quiet HEAD -- src/pricing.spec.ts src/catalog.json && bun test"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
