schema_version: "1.0"
name: vocab-trace
tags: [vocab]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Cite the files a placed reservation travels: the endpoint, the domain logic, the builder, and the shelf."
  max_turns: 30
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: regex
    name: "names the allotments ingress"
    target: last_message
    pattern: "src/ingress/allotments\\.ts"
  - type: regex
    name: "names the allotment steward"
    target: last_message
    pattern: "src/stewards/allotment\\.ts"
  - type: regex
    name: "names the allotment form"
    target: last_message
    pattern: "src/forms/allotment\\.ts"
  - type: regex
    name: "names the vault"
    target: last_message
    pattern: "src/lib/vault\\.ts"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
