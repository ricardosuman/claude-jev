schema_version: "1.0"
name: wide-change-validator
tags: [wide]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "On create, the stock-keeping identifier must be 8 to 16 characters of uppercase A-Z and digits only. Reject anything else with a 400. Add assertSku() to the shared validation helpers and call it from the create path that persists that identifier. Do not rewrite unrelated modules."
  max_turns: 30
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: command
    name: "hidden tests pass"
    run: "cp \"$CASE_DIR/hidden.spec.ts\" src/ && bun test"
  - type: regex
    name: "catalog service not rewritten"
    target: { source: file, path: src/services/catalogService.ts }
    pattern: "CATALOG_SYNC_BATCH\\s*=\\s*40"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
