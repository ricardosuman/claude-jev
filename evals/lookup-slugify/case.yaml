schema_version: "1.0"
name: lookup-slugify
tags: [lookup]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What does slugify('  A -- B  ') return, and why? Walk through the steps briefly."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: regex
    name: "answers 'a-b'"
    target: last_message
    pattern: "['\\\"`]a-b['\\\"`]"
  - type: regex
    name: "explains lowercasing"
    target: last_message
    pattern: "[Ll]ower"
  - type: regex
    name: "explains the edge trim"
    target: last_message
    pattern: "[Tt]rim|[Ll]eading|[Tt]railing|[Ss]trip"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
