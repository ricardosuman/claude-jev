schema_version: "1.0"
name: vocab-lookup
tags: [vocab]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Which environment variable governs how long a cancelled reservation lingers, and what is its default in minutes?"
  max_turns: 30
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: regex
    name: "names UNWIND_DWELL_MIN"
    target: last_message
    pattern: "\\bUNWIND_DWELL_MIN\\b"
  - type: regex
    name: "names the 73 default"
    target: last_message
    pattern: "\\b73\\b"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
