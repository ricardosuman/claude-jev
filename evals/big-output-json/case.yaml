schema_version: "1.0"
name: big-output-json
tags: [big-output]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Finance says our inventory value is way too high, it should be about 1.28 million. Run `bun run inventory` to see the stock report, then fix the bad record in data/products.json (it's the supplier's export). Don't change the code."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: command
    name: "report prints the right total, code unchanged"
    run: "git diff --quiet HEAD -- src && bun run src/report.ts | grep -qx 'Inventory value: 1281279.50'"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
