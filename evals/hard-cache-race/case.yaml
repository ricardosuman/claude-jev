schema_version: "1.0"
name: hard-cache-race
tags: [hard]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Users sometimes still see their old name after editing their profile, even though update() in src/profiles.ts saves and then invalidates the cache entry. It seems to happen when someone was loading the profile at the same moment. Please fix the cache (src/cache.ts) so this can't happen."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: command
    name: "hidden tests pass"
    run: "cp \"$CASE_DIR/hidden.spec.ts\" src/ && bun test"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
