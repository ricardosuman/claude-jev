schema_version: "1.0"
name: debug-slug
tags: [debug]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "`bun test` fails in this project: slugify() leaves a stray dash. Find the bug and fix it without changing any test."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: regex
    name: "trailing dash trimmed"
    target: { source: file, path: src/slug.ts }
    pattern: "-\\+?\\$"
  - type: regex
    name: "test left as it was"
    target: { source: file, path: src/slug.spec.ts }
    pattern: "toBe\\('a-b'\\)"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
