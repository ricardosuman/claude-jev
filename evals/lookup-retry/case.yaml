schema_version: "1.0"
name: lookup-retry
tags: [lookup]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "By default, how many times does retry() call its function before giving up, and what happens when every attempt fails? Answer briefly."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: regex
    name: "3 attempts by default"
    target: last_message
    pattern: "\\b(3|[Tt]hree)\\b"
  - type: regex
    name: "throws when every attempt fails"
    target: last_message
    pattern: "[Tt]hrow"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
