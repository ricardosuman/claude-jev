schema_version: "1.0"
name: change-tax-rate
tags: [local-change]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Change the sales-tax rate to 10% and update the tests in src/cart.spec.ts so they match the new rate."
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: regex
    name: "rate is 0.1"
    target: { source: file, path: src/cart.ts }
    pattern: "TAX_RATE\\s*=\\s*0?\\.10?\\b"
  - type: regex
    name: "test expects 11"
    target: { source: file, path: src/cart.spec.ts }
    pattern: "toBe\\(11\\)"
  - type: regex
    name: "test expects 5.5"
    target: { source: file, path: src/cart.spec.ts }
    pattern: "toBe\\(5\\.5\\)"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
