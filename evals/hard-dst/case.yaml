schema_version: "1.0"
name: hard-dst
tags: [hard]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Event times from weekly() in src/schedule.ts are wrong around clock changes. The New York team's Monday 9:00 standup shows as 8:00 from November on, and the Auckland quiz night that starts Saturday 26 Sep at 20:00 shows as 19:00. Events should stay at the same local time in their time zone every week. Can you fix it?"
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: command
    name: "hidden tests pass"
    run: "cp \"$CASE_DIR/hidden.spec.ts\" src/ && bun test"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
