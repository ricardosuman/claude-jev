schema_version: "1.0"
name: lookup-tax-rate
tags: [lookup]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What sales-tax rate does total() apply, and in which file is it defined? Answer in one or two sentences."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: regex
    name: "names the 8% rate"
    target: last_message
    pattern: "0\\.08|8 ?%"
  - type: regex
    name: "names src/cart.ts"
    target: last_message
    pattern: "cart\\.ts"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
