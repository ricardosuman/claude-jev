schema_version: "1.0"
name: wide-lookup-config
tags: [wide]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "One scheduled job re-checks records that have already settled, after a delay. Which environment variable configures that delay, and what is its default in minutes? Answer briefly."
  max_turns: 30
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: regex
    name: "names RECONCILE_WINDOW_MIN"
    target: last_message
    pattern: "\\bRECONCILE_WINDOW_MIN\\b"
  - type: regex
    name: "names the 47 default"
    target: last_message
    pattern: "\\b47\\b"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
