schema_version: "1.0"
name: vocab-debug
tags: [vocab]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Cancelling a reservation twice ought to fail. One endpoint inverts the conflict predicate. Repair it."
  max_turns: 30
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
runs: 3
graders:
  - type: command
    name: "hidden tests pass"
    run: "cp \"$CASE_DIR/hidden.spec.ts\" src/ && bun test"
  - type: regex
    name: jev hooks ran (/jev registered)
    target: trace
    pattern: "\"name\":\"jev\",\"description\":\"Jev ledger"
    arm: with-only
